<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Usuarios | Laboratorio Clínico</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body>
    <header class="topbar"><a class="brand" href="/">LABORATORIO CLÍNICO</a>
        <div class="top-actions"><span id="user-name"></span><button class="btn secondary" onclick="logout()">Cerrar
                sesión</button></div>
    </header>
    <div class="shell">
        <nav class="sidebar"><a href="/">Panel principal</a><a href="/personas">Personas</a><a
                href="/pacientes">Pacientes</a><a href="/analisis">Catalogo de Análisis</a><a
                href="/solicitudes">Solicitudes</a><a href="/resultados">Resultados</a><a href="/pagos">Pagos</a><a
                href="/reportes">Reportes</a><a href="/usuarios" class="active">Usuarios</a></nav>
        <main>
            <div class="page-head">
                <div>
                    <h1>Usuarios del sistema</h1>
                    <p class="muted">Cuentas, roles y vistas autorizadas.</p>
                </div>
            </div>
            <div id="notice" class="notice"></div>
            <section class="panel">
                <h2 id="form-title">Registrar usuario</h2>
                <form id="user-form"><input type="hidden" id="user-id">
                    <div class="fields">
                        <div class="field"><label for="usuario">Usuario *</label><input id="usuario" required
                                maxlength="60" autocomplete="off"></div>
                        <div class="field"><label for="nombre_completo">Nombre completo *</label><input
                                id="nombre_completo" required maxlength="120"></div>
                        <div class="field"><label for="rol">Rol *</label><select id="rol" required>
                                <option value="recepcionista">Recepcionista</option>
                                <option value="laboratorista">Laboratorista</option>
                                <option value="cajero">Cajero</option>
                            </select></div>
                        <div class="field"><label for="password">Contraseña <span
                                    id="password-required">*</span></label><input id="password" type="password"
                                minlength="10" autocomplete="new-password"><small id="password-help"
                                class="muted">Mínimo 10 caracteres.</small></div>
                        <div class="field full"><label>Vistas autorizadas</label>
                            <div id="permisos" class="checklist"></div>
                        </div>
                    </div>
                    <div class="form-actions"><button class="btn" type="submit">Guardar usuario</button><button
                            class="btn secondary" type="button" id="cancel-edit">Limpiar</button></div>
                </form>
            </section>
            <section class="panel">
                <div class="page-head">
                    <h2>Usuarios registrados</h2>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Usuario</th>
                                <th>Nombre</th>
                                <th>Rol</th>
                                <th>Vistas</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="rows"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="/assets/js/common.js"></script>
    <script>loadUser();</script>
    <script src="/assets/js/usuarios.js"></script>
</body>

</html>
