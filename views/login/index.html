<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión | Laboratorio Clínico</title><link rel="stylesheet" href="/assets/css/style.css"></head>
<body class="login-page"><main class="login-card"><h1>Laboratorio Clínico</h1><p class="muted">Ingresa con tu cuenta institucional.</p><div id="notice" class="notice"></div>
<form id="login-form"><div class="field"><label for="usuario">Usuario</label><input id="usuario" name="usuario" autocomplete="username" required autofocus></div><div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">Iniciar sesión</button></form></main>
<script src="/assets/js/common.js"></script><script>
document.querySelector('#login-form').addEventListener('submit',async e=>{e.preventDefault();notice('Verificando credenciales...');try{await api('/api/login',{method:'POST',body:JSON.stringify({usuario:document.querySelector('#usuario').value,password:document.querySelector('#password').value})});location.href='/';}catch(err){notice(err.message,true);}});
</script></body></html>
