<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Almacén | Laboratorio Clínico</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="/">LABORATORIO CLÍNICO</a><div class="top-actions"><span id="user-name"></span><button class="btn secondary" onclick="logout()">Cerrar sesión</button></div></header>
  <div class="shell">
    <nav class="sidebar"><a href="/">Panel principal</a><a href="/personas">Personas</a><a href="/pacientes">Pacientes</a><a href="/analisis">Análisis</a><a href="/solicitudes">Solicitudes</a><a href="/resultados">Resultados</a><a href="/pagos">Pagos</a><a href="/almacen" class="active">Almacén</a><a href="/reportes">Reportes</a></nav>
    <main>
      <div class="page-head"><div><h1>Almacén de químicos</h1><p class="muted">Existencias y niveles mínimos.</p></div></div>
      <div id="notice" class="notice"></div>
      <section class="panel">
        <h2 id="form-title">Registrar químico</h2>
        <form id="item-form"><input type="hidden" id="item-id"><div class="fields">
          <div class="field"><label for="nombre">Nombre del químico *</label><input id="nombre" required maxlength="120"></div>
          <div class="field"><label for="unidad">Unidad *</label><input id="unidad" required maxlength="40" placeholder="ml, g, frasco"></div>
          <div class="field"><label for="stock_actual">Existencia *</label><input id="stock_actual" type="number" min="0" step="0.01" value="0" required></div>
          <div class="field"><label for="stock_minimo">Stock mínimo *</label><input id="stock_minimo" type="number" min="0" step="0.01" value="0" required></div>
          <div class="field"><label for="activo">Estado</label><select id="activo"><option value="1">Activo</option><option value="0">Inactivo</option></select></div>
          <div class="field full"><label for="descripcion">Descripción</label><textarea id="descripcion"></textarea></div>
        </div><div class="form-actions"><button class="btn" type="submit">Guardar químico</button><button class="btn secondary" type="button" id="cancel-edit">Limpiar</button></div></form>
      </section>
      <section class="panel">
        <div class="page-head"><h2>Inventario</h2><input id="search" type="search" placeholder="Buscar por nombre del químico" aria-label="Buscar por nombre del químico" style="max-width:320px"></div>
        <div class="table-wrap"><table><thead><tr><th>Código</th><th>Químico</th><th>Unidad</th><th>Existencia</th><th>Mínimo</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="rows"></tbody></table></div>
      </section>
    </main>
  </div>
  <script src="/assets/js/common.js"></script><script>loadUser();</script><script src="/assets/js/almacen.js"></script>
</body>
</html>
