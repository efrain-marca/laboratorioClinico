<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Gestión de análisis | Laboratorio Clínico</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body>
    <header class="topbar"><a class="brand" href="/">LABORATORIO CLÍNICO</a>
        <div class="top-actions"><span id="user-name"></span><button class="btn secondary" onclick="logout()">Cerrar
                sesión</button></div>
    </header>
    <div class="shell">
        <nav class="sidebar"><a href="/" class="">Panel principal</a><a href="/personas" class="">Personas</a><a
                href="/pacientes" class="">Pacientes</a><a href="/analisis" class="active">Catalogo deAnálisis</a><a
                href="/solicitudes" class="">Solicitudes</a><a href="/resultados" class="">Resultados</a><a
                href="/pagos" class="">Pagos</a><a href="/reportes" class="">Reportes</a></nav>
        <main>
            <div class="page-head">
                <div>
                    <h1>Gestión de análisis</h1>
                    <p class="muted">Administra el catálogo de pruebas y sus precios.</p>
                </div>
            </div>
            <div id="notice" class="notice"></div>
            <section class="panel">
                <h2 id="form-title">Registrar análisis</h2>
                <form id="form"><input type="hidden" id="item-id">
                    <div class="fields">
                        <div class="field"><label for="codigo">Código *</label><input id="codigo" required></div>
                        <div class="field"><label for="nombre">Nombre *</label><input id="nombre" required></div>
                        <div class="field"><label for="precio">Precio (Bs) *</label><input id="precio" type="number"
                                min="0" step="0.01" required></div>
                        <div class="field"><label for="tiempo_entrega_horas">Tiempo de entrega (horas)</label><input
                                id="tiempo_entrega_horas" type="number" min="1" value="24"></div>
                        <div class="field"><label for="activo">Estado</label><select id="activo">
                                <option value="1">Activo</option>
                                <option value="0">Inactivo</option>
                            </select></div>
                        <div class="field full"><label for="descripcion">Descripción</label><textarea
                                id="descripcion"></textarea></div>
                    </div>
                    <div class="form-actions"><button class="btn">Guardar análisis</button><button class="btn secondary"
                            type="button" id="cancel">Limpiar</button></div>
                </form>
            </section>
            <section class="panel">
                <h2>Catálogo de análisis</h2>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Nombre</th>
                                <th>Precio</th>
                                <th>Entrega</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="rows"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="/assets/js/common.js"></script>
    <script>loadUser();</script>
    <script src="/assets/js/analisis.js"></script>
</body>

</html>
