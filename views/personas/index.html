<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestión de personas | Laboratorio Clínico</title><link rel="stylesheet" href="/assets/css/style.css"></head><body>
<header class="topbar"><a class="brand" href="/">LABORATORIO CLÍNICO</a><div class="top-actions"><span id="user-name"></span><button class="btn secondary" onclick="logout()">Cerrar sesión</button></div></header>
<div class="shell"><nav class="sidebar"><a href="/" class="">Panel principal</a><a href="/personas" class="active">Personas</a><a href="/pacientes" class="">Pacientes</a><a href="/analisis" class="">Catalogo de Análisis</a><a href="/solicitudes" class="">Solicitudes</a><a href="/resultados" class="">Resultados</a><a href="/pagos" class="">Pagos</a><a href="/reportes" class="">Reportes</a></nav><main><div class="page-head"><div><h1>Gestión de personas</h1><p class="muted">Registra y administra los datos personales.</p></div></div><div id="notice" class="notice"></div>
<section class="panel"><h2 id="form-title">Registrar persona</h2><form id="item-form"><input type="hidden" id="item-id"><div class="fields">
<div class="field"><label for="ci">CI *</label><input id="ci" required maxlength="30"></div><div class="field"><label for="nombres">Nombres *</label><input id="nombres" required></div><div class="field"><label for="apellidos">Apellidos *</label><input id="apellidos" required></div>
<div class="field"><label for="fecha_nacimiento">Fecha de nacimiento</label><input id="fecha_nacimiento" type="date"></div><div class="field"><label for="sexo">Sexo</label><select id="sexo"><option>No especificado</option><option>F</option><option>M</option><option>Otro</option></select></div>
<div class="field"><label for="telefono">Teléfono</label><input id="telefono"></div><div class="field"><label for="email">Correo electrónico</label><input id="email" type="email"></div><div class="field full"><label for="direccion">Dirección</label><input id="direccion"></div></div><div class="form-actions"><button class="btn" type="submit">Guardar</button><button class="btn secondary" type="button" id="cancel-edit">Limpiar</button></div></form></section>
<section class="panel"><div class="page-head"><h2>Personas registradas</h2><input id="search" placeholder="Buscar por CI o nombre" style="max-width:300px"></div><div class="table-wrap"><table><thead><tr><th>CI</th><th>Nombre completo</th><th>Teléfono</th><th>Correo</th><th>Acciones</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main></div>
<script src="/assets/js/common.js"></script><script>loadUser();</script><script src="/assets/js/personas.js"></script></body></html>
